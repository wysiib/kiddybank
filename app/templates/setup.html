{% extends "base.html" %}
{% block content %}
<h1 class="text-4xl font-extrabold">{{ t('setup.title') }}</h1>
<p>{{ t('setup.intro') }}</p>
{% if error %}<p class="error">{{ t(error) }}</p>{% endif %}
<form method="post" action="/setup" class="card space-y-4">
  <label class="block">{{ t('setup.name') }}<input class="input" name="name" required></label>
  <label class="block">{{ t('setup.pin') }}<input class="input" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label>
  <button class="btn w-full">{{ t('app.next') }}</button>
</form>
{% endblock %}
