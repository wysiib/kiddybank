{% extends "base.html" %}
{% from "_keypad.html" import keypad %}
{% block content %}
<div class="text-center">
  <div class="text-7xl">{{ who.avatar }}</div>
  <h1 class="text-3xl font-extrabold">{{ who.name }}</h1>
  <p>{{ t('login.pin') }}</p>
</div>
{% if error %}<p class="error text-center">{{ t(error) }}</p>{% endif %}
<form method="post" action="/login/{{ who.id }}" class="space-y-6">
  <input type="hidden" name="pin" value="">
  {{ keypad('/login', shake=error) }}
</form>
{% endblock %}
