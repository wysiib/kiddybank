{% extends "base.html" %}
{% block content %}
<h1 class="text-center text-4xl font-extrabold">{{ t('login.who') }}</h1>
<div class="grid grid-cols-2 gap-4">
  {% for u in users %}
  <a href="/login/{{ u.id }}" class="tile min-h-44">
    <span class="text-7xl">{{ u.avatar }}</span>
    {{ u.name }}
  </a>
  {% endfor %}
</div>
{% endblock %}
