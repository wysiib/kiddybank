{% set w = towers[p.id] %}
{% macro bar(kind, cents, h) %}
<div class="flex flex-col items-center justify-end">
  <span class="text-sm font-bold">{{ t('fg.cent', n=cents) if cents < 100 else cents|money }}</span>
  <div class="tower tower-{{ kind }}" style="height: calc({{ h }} * 0.06rem)"></div>
  <span class="text-sm font-normal text-slate-500">{{ t('fg.tower.' ~ kind) }}</span>
</div>
{% endmacro %}
<div class="flex h-36 items-end justify-center gap-2 border-slate-200">
  {{ bar('giro', w.giro, w.giro_h) }}{{ bar('fg', w.fg, w.fg_h) }}
</div>
