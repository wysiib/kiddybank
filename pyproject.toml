[project]
name = "kiddybank"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi",
    "sqlmodel",
    "jinja2",
    "uvicorn",
    "itsdangerous",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["F", "B"]
ignore = ["B008"]  # FastAPI's Depends() / Form() defaults
